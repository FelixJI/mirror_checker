name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认 cp1252 控制台；统一 UTF-8 输出
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装可选开发依赖（jsonschema 用于 Schema 一致性检查）
        run: python -m pip install "jsonschema>=4,<5"
      - name: 单元测试（unittest）
        run: python -m unittest discover -s tests -p "test_*.py" -t .
        env:
          PYTHONPATH: python
      - name: CLI 校验范例会话
        run: python -m mirror_cli validate tests/fixtures/synthetic_session_v1.zip
        env:
          PYTHONPATH: python
      - name: 范例会话可由生成器确定性重建
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          python -m mirror_cli make-sample --output "$RUNNER_TEMP/regen.zip"
          cmp tests/fixtures/synthetic_session_v1.zip "$RUNNER_TEMP/regen.zip"

  android:
    name: Android (tests + diagnostic APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0" >/dev/null
      - name: Kotlin 测试（contracts/probe）
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :contracts:test :probe:test
      - name: 构建诊断 APK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: 上传诊断 APK（H03 真机安装）
        uses: actions/upload-artifact@v4
        with:
          name: mirror-diag-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
