name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认 cp1252 控制台；统一 UTF-8 输出
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装可选开发依赖（jsonschema 用于 Schema 一致性检查）
        run: python -m pip install "jsonschema>=4,<5"
      - name: 单元测试（unittest）
        run: python -m unittest discover -s tests -p "test_*.py" -t .
        env:
          PYTHONPATH: python
      - name: CLI 校验范例会话
        run: python -m mirror_cli validate tests/fixtures/synthetic_session_v1.zip
        env:
          PYTHONPATH: python
      - name: 范例会话可由生成器确定性重建
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          python -m mirror_cli make-sample --output "$RUNNER_TEMP/regen.zip"
          cmp tests/fixtures/synthetic_session_v1.zip "$RUNNER_TEMP/regen.zip"

  android:
    name: Android contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin 契约测试
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :contracts:test
